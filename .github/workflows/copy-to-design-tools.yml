name: Copy Design Tools Portal to design-tools repo

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout source (.github repo)
        uses: actions/checkout@v4
        with:
          ref: claude/design-system-tools-portal-CV61S

      - name: Push portal files to design-tools
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git clone https://x-access-token:${PAT_TOKEN}@github.com/otrobonita-studios/design-tools.git design-tools-repo

          cd design-tools-repo

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create main branch if repo is empty
          if [ -z "$(git branch -a)" ]; then
            git checkout -b main
          else
            git checkout main 2>/dev/null || git checkout -b main
          fi

          cp ../design-system-tools/index.html         index.html
          cp ../design-system-tools/t-light-tokens.css t-light-tokens.css
          cp ../design-system-tools/portal.css         portal.css
          cp ../design-system-tools/app.js             app.js

          git add .
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Add T-Light Design System Tools portal"
          git push origin main
